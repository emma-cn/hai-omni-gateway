<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hai-omni-gateway 控制台</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1e252d; --line:#2a333d;
    --fg:#e6edf3; --dim:#8b98a5; --ok:#3fb950; --warn:#d29922; --err:#f85149; --acc:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);
         position:sticky;top:0;background:rgba(15,18,22,.92);backdrop-filter:blur(6px);z-index:9}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .badge.ok{color:var(--ok);border-color:#1f4429;background:#0d1f13}
  .badge.err{color:var(--err);border-color:#4b1d1d;background:#1f0f0f}
  main{padding:18px 20px 60px;max-width:1400px;margin:0 auto}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:26px 0 10px;font-weight:600}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .panel h3{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.05em}
  .awake{display:flex;align-items:center;gap:8px;font-size:13px}
  .dot{width:8px;height:8px;border-radius:50%;background:#39424c}
  .dot.on{background:var(--ok);box-shadow:0 0 8px #3fb95088}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:none}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#9cdcfe}
  button{font:inherit;padding:6px 12px;border-radius:7px;border:1px solid var(--line);
         background:var(--panel2);color:var(--fg);cursor:pointer;transition:.15s}
  button:hover:not(:disabled){border-color:#3d4a58;background:#232d38}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  button.primary:hover:not(:disabled){background:#2b7ef5}
  button.ghost{padding:4px 9px;font-size:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field label{font-size:12px;color:var(--dim)}
  input,textarea,select{font:inherit;background:#0d1116;color:var(--fg);border:1px solid var(--line);
        border-radius:8px;padding:9px 11px;width:100%}
  textarea{resize:vertical;min-height:96px}
  .muted{color:var(--dim);font-size:12px}
  .events{max-height:280px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .ev{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed #232b34}
  .ev:last-child{border-bottom:none}
  .ev .t{color:#6e7b8a;min-width:64px}
  .k{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;margin-right:6px}
  .k.wake{background:#0d1f13;color:var(--ok)}
  .k.sleep{background:#1a2230;color:#79a6ff}
  .k.switch{background:#241d0d;color:var(--warn)}
  .k.fail{background:#1f0f0f;color:var(--err)}
  .k.idle_sleep{background:#181e26;color:#8b98a5}
  .st{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .st.awake{color:var(--ok);border-color:#1f4429;background:#0d1f13}
  .st.asleep{color:var(--dim)}
  audio{width:100%;margin-top:10px}
  .split{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;align-items:start}
  @media(max-width:900px){.split{grid-template-columns:1fr}}
  .pill{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-right:4px}
  /* 凭据缺失/失效时高亮输入框：不要让用户对着"连接失败"猜原因 */
  input.bad{border-color:var(--err)!important;box-shadow:0 0 0 2px #f8514933}
  .hint{font-size:12px;color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>hai-omni-gateway</h1>
  <span id="ver" class="badge">…</span>
  <span id="conn" class="badge">连接中</span>
  <span class="badge" id="autoref">自动刷新 2s</span>
  <div style="margin-left:auto" class="row">
    <input id="adm" type="password" placeholder="Admin token（存本机 localStorage）"
           style="width:250px" autocomplete="off" spellcheck="false" />
    <button class="ghost" onclick="saveToken()">保存</button>
    <button class="ghost" onclick="load()">刷新</button>
  </div>
</header>

<main>
  <h2>显卡</h2>
  <div class="grid cards" id="cards"></div>

  <h2>模型</h2>
  <div class="panel" style="padding:0;overflow:auto">
    <table>
      <thead><tr><th>模型</th><th>能力</th><th>卡</th><th>状态</th><th>在飞</th><th>TTL</th><th style="width:190px">操作</th></tr></thead>
      <tbody id="models"><tr><td colspan="7" class="muted" style="padding:16px">加载中…</td></tr></tbody>
    </table>
  </div>

  <div class="split" style="margin-top:22px">
    <div>
      <h2>测试</h2>
      <div class="panel">
        <div class="field">
          <label>模型</label>
          <select id="tModel"></select>
        </div>
        <div class="field">
          <label>文本</label>
          <textarea id="tText">今天天气不错，我们来测试一下这个网关的合成链路。</textarea>
        </div>
        <div class="field">
          <label>参考音频（可选：上传本地文件，或填容器内路径如 /media/xxx.wav）</label>
          <input type="file" id="tFile" accept="audio/*" />
          <input id="tRefPath" placeholder="file:///media/xxx.wav（可留空）" />
        </div>
        <div class="field">
          <label>API key（可选：生产上业务面按 key 鉴权，admin token 通常不能调 /v1）</label>
          <input id="apiKey" type="password" placeholder="sk-…（存本机 localStorage）" autocomplete="off" />
        </div>
        <div class="row">
          <button class="primary" id="tGo" onclick="synthesize()">合成</button>
          <span class="muted" id="tMsg"></span>
        </div>
        <div id="tOut"></div>
      </div>
    </div>

    <div>
      <h2>事件</h2>
      <div class="panel">
        <div class="events" id="events"><div class="muted">暂无事件</div></div>
      </div>
    </div>
  </div>
</main>

<script>
let STATE = {cards: [], models: []};

// ---------------------------------------------------------------- 凭据
// 为什么用 localStorage 而不是 ?token=：
//   URL 里的 token 会进服务器访问日志、浏览器历史、Referer 头，
//   一次误发就等于泄露。localStorage 只留在本机浏览器里。
// 为什么不要求每次输一遍：token 是长期凭据，控制台是内部页面，反复输入只会催生"存文本里"。
const LS_ADM = 'omni.admin_token';
const LS_KEY = 'omni.api_key';

function getTok(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function setTok(k, v){ try{ v ? localStorage.setItem(k, v) : localStorage.removeItem(k); }catch(e){} }

function saveToken(){
  const adm = document.getElementById('adm');
  setTok(LS_ADM, adm.value.trim());
  adm.classList.remove('bad');
  setHint('');
  load();
}

function setHint(msg){
  const el = document.getElementById('autoref');
  if(msg){ el.textContent = msg; el.className = 'badge err'; }
  else { el.textContent = '自动刷新 2s'; el.className = 'badge'; }
}

/** 统一带凭据的 fetch。
 *  - 运维面（/admin/*、/metrics）用 admin token
 *  - 业务面（/v1/audio/*）用 API key；没填 API key 就退回 admin token，
 *    因为单机 dev 常把同一串既当 admin 又当 key（生产要分开）
 *  401/403 时高亮输入框——别让用户对着"连接失败"猜是网络还是凭据。
 */
async function apiFetch(path, opts){
  opts = opts || {};
  const isOps = path.startsWith('/admin') || path.startsWith('/metrics');
  const tok = isOps ? getTok(LS_ADM) : (getTok(LS_KEY) || getTok(LS_ADM));
  const headers = Object.assign({}, opts.headers || {});
  if(tok) headers['Authorization'] = 'Bearer ' + tok;
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  if(r.status === 401 || r.status === 403){
    const el = document.getElementById('adm');
    if(el) el.classList.add('bad');
    setHint(r.status === 401 ? '需要 Admin token（点右上角填写）' : '凭据权限不足');
  }
  return r;
}

function initTokenInput(){
  const el = document.getElementById('adm');
  el.value = getTok(LS_ADM);
  el.addEventListener('keydown', e => { if(e.key === 'Enter') saveToken(); });
  const k = document.getElementById('apiKey');
  k.value = getTok(LS_KEY);
  k.addEventListener('change', () => setTok(LS_KEY, k.value.trim()));
}

function fmtTime(ts){
  const d = new Date(ts*1000);
  return d.toTimeString().slice(0,8);
}
function esc(s){return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function load(){
  try{
    const r = await apiFetch('/admin/state', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const s = await r.json();
    STATE = s;
    render(s);
    document.getElementById('conn').textContent = '已连接';
    document.getElementById('conn').className = 'badge ok';
    document.getElementById('ver').textContent = 'v' + s.version;
  }catch(e){
    document.getElementById('conn').textContent = '连接失败';
    document.getElementById('conn').className = 'badge err';
  }
}

function render(s){
  const cards = s.cards || [];
  document.getElementById('cards').innerHTML = cards.map(c=>`
    <div class="panel">
      <h3>${esc(c.card)}</h3>
      <div class="awake">
        <span class="dot ${c.awake?'on':''}"></span>
        <span>${c.awake ? '醒着：<code>'+esc(c.awake)+'</code>' : '全部睡眠'}</span>
      </div>
      <div class="muted" style="margin-top:8px">
        在飞：${Object.entries(c.inflight||{}).filter(([,v])=>v>0).map(([k,v])=>esc(k.split('/').pop())+' '+v).join(' · ') || '—'}
        ｜ min_dwell ${c.min_dwell_s}s
      </div>
    </div>`).join('') || '<div class="panel muted">无显卡配置</div>';

  document.getElementById('models').innerHTML = (s.models||[]).map(m=>{
    const inflight = (m.inflight||0);
    const sleeping = m.status !== 'awake';
    return `<tr>
      <td><code>${esc(m.name)}</code></td>
      <td>${(m.capabilities||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</td>
      <td class="muted">${esc(m.card)}</td>
      <td><span class="st ${sleeping?'asleep':'awake'}">${sleeping?'睡眠':'醒着'}</span></td>
      <td>${inflight||'—'}</td>
      <td class="muted">${m.ttl_s>0? m.ttl_s+'s':'永不睡'}</td>
      <td>
        <button class="ghost" ${!sleeping?'disabled':''} onclick="ctl('${esc(m.name)}','wake',this)">唤醒</button>
        <button class="ghost" ${sleeping||inflight?'disabled':''} onclick="ctl('${esc(m.name)}','sleep',this)">睡眠</button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" class="muted" style="padding:16px">无模型配置</td></tr>';

  const evs = cards.flatMap(c=>(c.events||[]).map(e=>({...e, card:c.card})))
                  .sort((a,b)=>b.ts-a.ts).slice(0,60);
  document.getElementById('events').innerHTML = evs.length ? evs.map(e=>`
    <div class="ev">
      <span class="t">${fmtTime(e.ts)}</span>
      <span><span class="k ${e.kind}">${e.kind}</span>${esc((e.model||'').split('/').pop())}
      <span class="muted">${esc(e.detail||'')}</span></span>
    </div>`).join('') : '<div class="muted">暂无事件</div>';

  const sel = document.getElementById('tModel');
  const cur = sel.value;
  const opts = (s.models||[]).filter(m=>(m.capabilities||[]).includes('speech'));
  if(sel.dataset.sig !== JSON.stringify(opts.map(o=>o.name))){
    sel.innerHTML = opts.map(m=>`<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('');
    sel.dataset.sig = JSON.stringify(opts.map(o=>o.name));
    if(cur) sel.value = cur;
  }
}

async function ctl(model, action, btn){
  btn.disabled = true;
  try{
    const r = await apiFetch('/admin/'+action, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model})
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) alert('失败：' + (j.detail || j.error?.message || r.status));
  }catch(e){ alert('请求失败：'+e); }
  finally{ btn.disabled = false; load(); }
}

async function synthesize(){
  const btn = document.getElementById('tGo');
  const msg = document.getElementById('tMsg');
  const out = document.getElementById('tOut');
  const model = document.getElementById('tModel').value;
  const text = document.getElementById('tText').value.trim();
  if(!model || !text){ msg.textContent = '请选模型并填文本'; return; }

  btn.disabled = true; msg.textContent = '合成中…（模型睡着的话会先唤醒，约 4~5 秒）';
  out.innerHTML = '';
  const t0 = performance.now();

  try{
    const payload = {model, input:text, response_format:'wav'};
    const file = document.getElementById('tFile').files[0];
    const refPath = document.getElementById('tRefPath').value.trim();
    if(file){
      payload.ref_audio = await new Promise((res,rej)=>{
        const fr = new FileReader();
        fr.onload = ()=>res(fr.result); fr.onerror = rej; fr.readAsDataURL(file);
      });
    }else if(refPath){
      payload.ref_audio = refPath;
    }

    const r = await apiFetch('/v1/audio/speech', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
    });
    const ms = Math.round(performance.now()-t0);
    if(!r.ok){
      const j = await r.json().catch(()=>({}));
      msg.textContent = `失败 ${r.status} · ${ms}ms`;
      out.innerHTML = '<div class="muted" style="color:var(--err)">'+esc(j.error?.message || JSON.stringify(j))+'</div>';
      return;
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const eta = r.headers.get('X-Omni-Wake-ETA');
    msg.textContent = `成功 · ${ms}ms · ${(blob.size/1024).toFixed(0)} KB` + (eta? ` · 唤醒ETA ${eta}s`:'');
    out.innerHTML = `<audio controls autoplay src="${url}"></audio>
      <div class="row" style="margin-top:8px">
        <a href="${url}" download="omni_${Date.now()}.wav"><button class="ghost">下载音频</button></a>
      </div>`;
  }catch(e){
    msg.textContent = '异常：'+e;
  }finally{
    btn.disabled = false;
    load();
  }
}

initTokenInput();
load();
setInterval(load, 2000);
</script>
</body>
</html>
