name: ci

# 红线：CI 不过不许打 tag、不许发版（见 AGENTS.md「施工规则 7」）

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-gate:
    name: 敏感信息闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 需要完整历史才能扫 --history
      - name: 扫描工作区与历史
        run: |
          chmod +x scripts/secret_scan.sh
          scripts/secret_scan.sh --history

  lint-and-smoke:
    name: lint + 冒烟
    runs-on: ubuntu-latest
    needs: secret-gate
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts
      - name: Import smoke
        run: python -c "import omni_gateway, omni_gateway.app, omni_gateway.scheduler, omni_gateway.upstream; print('import ok', omni_gateway.__version__)"
      - name: Config loads (example must stay valid)
        run: python -c "from omni_gateway.config import GatewayConfig; c=GatewayConfig.load('config/gateway.example.yaml'); assert c.models; print('models:', sorted(c.models), 'cards:', sorted(c.cards))"
      - name: Tests
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            pytest -q
          else
            echo "no tests yet"
          fi

  docker-build:
    name: 镜像可构建
    runs-on: ubuntu-latest
    needs: secret-gate
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t hai-omni-gateway:ci .
