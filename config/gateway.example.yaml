# hai-omni-gateway 配置示例
#
# 模型名 = 客户端请求里 model 字段的值 = vllm-omni 实际服务的名字。
# 不做任何改写（llama-swap 的教训：model 是受保护字段，最省事的做法是名字对齐）。
#
# 卡（card）是调度单位：同一张卡上同一时刻只允许一个模型醒着。

listen: 0.0.0.0:8080

# 每个模型「允许排队等待」的请求数上限：达到上限后新请求立刻 429 queue_full + Retry-After。
# 0 = 不排队（超过 concurrency 立即 429）。
# 进系统的总量 = 模型 concurrency + queue_limit（例：4 + 16 = 同模型最多 20 个请求在系统内）。
queue_limit: 200

cards:
  card4:                 # 示例：开发机唯一的 4090；多卡机器上按 4/5/6/7 号卡分配
    # 一个模型醒着至少驻留多久才允许被挤掉。
    # 实测教训：设 20s 时，"请求 B 而 A 刚醒"要硬等满 20s 才换台（实测一次切换 22s）。
    # 3~5s 才是合理区间：足够滤掉瞬间交错，又不会让用户明显感觉到停顿。
    min_dwell_s: 5
    drain_timeout_s: 10  # 换台前等在途请求清零的上限

models:
  "/models/IndexTTS-2.5":
    base_url: http://127.0.0.1:60589
    card: card4
    stage_ids: [0, 1]
    capabilities: [speech]          # 能接 /v1/audio/speech、/v1/audio/voices
    sleep_level: 1
    wake_timeout_s: 60
    request_timeout_s: 120
    ttl_s: 600
    concurrency: 4      # 对齐 vllm 的 max_num_seqs

  "/models/VoxCPM2":
    base_url: http://127.0.0.1:60592
    card: card4
    stage_ids: [0]
    capabilities: [speech]
    sleep_level: 1
    wake_timeout_s: 60
    request_timeout_s: 120
    ttl_s: 300
    concurrency: 8      # 对齐 vllm 的 max_num_seqs

